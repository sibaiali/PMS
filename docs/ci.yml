name: SmartPark Guardian AI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Milestone 1 & Full Ecosystem Unit/Integration Tests
        run: |
          python -m unittest discover -s tests -p "test_milestone1_legacy.py" -v
          python -m unittest tests/test_smartpark_ecosystem.py -k "not test_20_gui" -v

      - name: Run Deterministic CLI Demonstration & Verify Asset Export
        run: |
          python -m smartpark --demo --export-png /tmp/ci_simulation_snapshot.png
